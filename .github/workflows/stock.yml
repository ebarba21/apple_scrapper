name: Vigilante stock iPhone

on:
  schedule:
    # Una comprobacion ligera (~15 s) cada ~5 min (minimo de GitHub), en minutos
    # desplazados para evitar las horas punta (:00, :30).
    - cron: '2-57/5 * * * *'
  workflow_dispatch:   # ejecucion manual = diagnostico (manda un mensaje a Telegram)

# Necesario para commitear state.json / history.csv
permissions:
  contents: write

concurrency:
  group: apple-stock
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 vigilante_stock.py --once --notify
          else
            python3 vigilante_stock.py --check
          fi

      # Solo hay commit cuando cambia el estado (stock / latido diario / errores): muy pocos
      - name: Guardar estado e historial
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json history.csv
          if git diff --staged --quiet; then
            echo "Sin cambios de estado."
          else
            git commit -m "chore: estado del stock [skip ci]"
            git pull --rebase --autostash
            git push
          fi
