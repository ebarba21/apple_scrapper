name: Vigilante stock iPhone (respaldo manual)

# La vigilancia automatica la hace el Worker de Cloudflare (cron cada 2 min).
# Este workflow queda solo como diagnostico/respaldo: se lanza a mano desde Actions > Run workflow.
# Para volver a activarlo como respaldo automatico, anade de nuevo:
#   schedule:
#     - cron: '2-57/5 * * * *'
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple-stock
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 vigilante_stock.py --once --notify

      - name: Guardar estado e historial
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json history.csv
          if git diff --staged --quiet; then
            echo "Sin cambios de estado."
          else
            git commit -m "chore: estado del stock [skip ci]"
            git pull --rebase --autostash
            git push
          fi
